name: Sestavení aplikace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLET_VERSION: "1.1.2"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Testy pravidel a obrazovek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet==${FLET_VERSION}" pytest pillow
      - run: pytest -q

  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Písma (OFL, Google Fonts)
        run: bash scripts/fetch_fonts.sh
      - name: Instalace Flet
        run: pip install "flet==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"
      - name: Podpisový klíč (pokud je nastaven)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n"' | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/upload-keystore.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Chybí podpisový klíč. Novou verzi půjde nainstalovat jen po odinstalování staré (smaže data)."
          fi
      - name: Sestavení APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: upload
        run: flet build apk --yes --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: denik-dobrodruha-android
          path: build/apk/*.apk
          if-no-files-found: error

  web:
    name: Webová verze (pro iPhone)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Písma (OFL, Google Fonts)
        run: bash scripts/fetch_fonts.sh
      - name: Instalace Flet
        run: pip install "flet==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"
      - name: Sestavení webu
        run: flet build web --yes --verbose --base-url "${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    name: Zveřejnění na GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
